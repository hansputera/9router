name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY_DOCKER: docker.io
  REGISTRY_GHCR: ghcr.io
  # GitHub Container Registry pushes to the same org as the repo owner
  IMAGE_NAME: ${{ github.repository }}

jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from git tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bake and push (release)
        if: steps.tag.outputs.is_release == 'true'
        env:
          TAG: ${{ steps.tag.outputs.version }}
        run: |
          # Rewrite tags to include both registries
          docker buildx bake -f docker-bake.hcl \
            --set "node.tags=${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}:${{ env.TAG }},${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}:node-latest,${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}:node-${{ env.TAG }},${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:${{ env.TAG }},${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:node-latest,${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:node-${{ env.TAG }}" \
            --set "bun.tags=${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}:bun-latest,${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}:bun-${{ env.TAG }},${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:bun-latest,${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:bun-${{ env.TAG }}" \
            --push

      - name: Bake and push (latest)
        if: steps.tag.outputs.is_release != 'true'
        run: |
          docker buildx bake -f docker-bake.hcl \
            --set "node.tags=${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}:node-latest,${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:node-latest" \
            --set "bun.tags=${{ env.REGISTRY_DOCKER }}/${{ env.IMAGE_NAME }}:bun-latest,${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}:bun-latest" \
            --push
