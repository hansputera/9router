services:
  # ─── Default: Node variant ──────────────────────────────────────────────
  9router-node:
    image: hansputera/9router-fork:node-latest
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom
    profiles:
      - default
      - node

  # ─── Bun variant ────────────────────────────────────────────────────────
  9router-bun:
    image: hansputera/9router-fork:bun-latest
    container_name: 9router-bun
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-bun-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom
    profiles:
      - bun

  # ─── Headroom sidecar (optional, used by both variants) ─────────────────
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

volumes:
  9router-data:
    name: 9router-data
  9router-bun-data:
    name: 9router-bun-data
